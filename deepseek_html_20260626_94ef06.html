<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سازنده استیکر حرفه‌ای</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 30px 25px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 i {
            color: #ffd700;
            margin: 0 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .input-group label {
            color: #e0e0e0;
            font-size: 0.95rem;
            font-weight: 300;
        }

        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-row input {
            flex: 2;
            min-width: 170px;
            padding: 16px 24px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 1rem;
            outline: 2px solid transparent;
            transition: 0.3s;
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.3);
        }

        .input-row input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .input-row input:focus {
            outline: 2px solid #ffd700;
            background: rgba(255, 255, 255, 0.2);
        }

        .input-row button {
            flex: 0.8;
            min-width: 100px;
            padding: 16px 28px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #1a1a2e;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-row button:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 35px rgba(255, 215, 0, 0.5);
        }

        .input-row button:active {
            transform: scale(0.95);
        }

        /* استیکر */
        .sticker-wrapper {
            display: flex;
            justify-content: center;
            margin: 20px 0 25px;
        }

        #stickerBox {
            background: rgba(0, 0, 0, 0.3);
            padding: 18px;
            border-radius: 50px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 215, 0, 0.15);
            display: inline-block;
            transition: 0.3s;
        }

        #sticker {
            width: 280px;
            height: 280px;
            border-radius: 40px;
            background: linear-gradient(145deg, #ffd966, #ffb347);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-shadow: inset 0 -6px 0 rgba(0,0,0,0.08), 0 20px 35px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            transition: 0.4s;
        }

        #sticker::before {
            content: "✦";
            position: absolute;
            top: 10px;
            left: 18px;
            font-size: 2.6rem;
            color: rgba(255, 255, 255, 0.2);
            transform: rotate(-12deg);
        }

        #sticker::after {
            content: "✧";
            position: absolute;
            bottom: 10px;
            right: 18px;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.15);
            transform: rotate(12deg);
        }

        .sticker-emoji {
            font-size: 4.8rem;
            line-height: 1.2;
            margin-bottom: 12px;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
            background: rgba(255,255,240,0.15);
            padding: 6px 22px;
            border-radius: 80px;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        .sticker-text {
            font-size: 1.9rem;
            font-weight: 800;
            color: #1e1e2f;
            text-shadow: 0 2px 12px rgba(255, 215, 0, 0.3);
            word-break: break-word;
            max-width: 90%;
            background: rgba(255, 255, 200, 0.2);
            padding: 6px 20px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            z-index: 2;
            line-height: 1.3;
        }

        /* دکمه‌های پایین */
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            padding: 14px 28px;
            border-radius: 50px;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            letter-spacing: 0.5px;
        }

        .action-btn i {
            color: #ffd700;
            font-size: 1.2rem;
        }

        .action-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.15);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.copy-btn i {
            color: #6bcbff;
        }
        .action-btn.copy-btn:hover {
            border-color: #6bcbff;
            background: rgba(107, 203, 255, 0.12);
        }

        #statusMsg {
            text-align: center;
            margin-top: 16px;
            color: #aaffaa;
            font-size: 0.9rem;
            min-height: 28px;
            font-weight: 300;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        @media (max-width: 500px) {
            .container { padding: 20px 15px; }
            #sticker { width: 220px; height: 220px; }
            .sticker-text { font-size: 1.3rem; }
            .sticker-emoji { font-size: 3.6rem; }
            .input-row input { min-width: 130px; }
            .action-btn { padding: 12px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fas fa-crown"></i> استیکر هوشمند <i class="fas fa-crown"></i></h2>

        <div class="input-group">
            <label><i class="fas fa-feather-alt" style="margin-left: 8px; color: #ffd700;"></i> موضوع استیکر:</label>
            <div class="input-row">
                <input type="text" id="topicInput" placeholder="مثلاً: عشق، موفقیت، آرامش..." value="شادی">
                <button id="generateBtn"><i class="fas fa-wand-magic-sparkles"></i> بساز</button>
            </div>
        </div>

        <div class="sticker-wrapper">
            <div id="stickerBox">
                <div id="sticker">
                    <div class="sticker-emoji" id="emojiDisplay">🌸</div>
                    <div class="sticker-text" id="textDisplay">شادی</div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" id="downloadBtn">
                <i class="fas fa-download"></i> دانلود PNG
            </button>
            <button class="action-btn copy-btn" id="copyBtn">
                <i class="fas fa-copy"></i> کپی استیکر
            </button>
        </div>
        <div id="statusMsg"></div>
    </div>

    <script>
        (function() {
            const topicInput = document.getElementById('topicInput');
            const generateBtn = document.getElementById('generateBtn');
            const emojiDisplay = document.getElementById('emojiDisplay');
            const textDisplay = document.getElementById('textDisplay');
            const stickerBox = document.getElementById('stickerBox');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyBtn = document.getElementById('copyBtn');
            const statusMsg = document.getElementById('statusMsg');

            // دیکشنری ایموجی
            const emojiMap = {
                'عشق': '❤️‍🔥', 'شادی': '🌸', 'موفقیت': '🏆', 'امید': '🌈',
                'دوستی': '🤝', 'خانواده': '👨‍👩‍👧‍👦', 'کافه': '☕', 'سفر': '✈️',
                'دریا': '🌊', 'ماه': '🌙', 'خورشید': '☀️', 'ستاره': '⭐',
                'گل': '🌹', 'کتاب': '📚', 'موسیقی': '🎵', 'هنر': '🎨',
                'آشپزی': '🍳', 'ورزش': '⚽', 'یوگا': '🧘', 'پول': '💰',
                'کار': '💼', 'رویا': '💭', 'شب': '🌃', 'بهار': '🌱',
                'تابستان': '🌻', 'پاییز': '🍂', 'زمستان': '❄️', 'تولد': '🎂',
                'عروسی': '💍', 'سلامتی': '💚', 'انرژی': '⚡', 'آرامش': '🍃',
                'خنده': '😂', 'شگفتی': '✨', 'زیبایی': '💎', 'قدرت': '💪',
                'خلاقیت': '🎭', 'طبیعت': '🌳', 'پرنده': '🕊️', 'دانش': '🎓',
                'فناوری': '💻', 'هوش': '🧠', 'مدیتیشن': '🧘‍♂️', 'کریسمس': '🎄',
                'نوروز': '🌿', 'عظمت': '🌟'
            };

            const fallbackEmojis = ['✨', '🌟', '💫', '🎈', '💖', '🌈', '🔥', '⭐', '🌸', '🍀'];

            function getEmojiForTopic(topic) {
                if (!topic) return '✨';
                const trimmed = topic.trim();
                for (let [key, emoji] of Object.entries(emojiMap)) {
                    if (trimmed.includes(key) || key.includes(trimmed)) return emoji;
                }
                const words = trimmed.split(' ');
                for (let word of words) {
                    for (let [key, emoji] of Object.entries(emojiMap)) {
                        if (word.includes(key) || key.includes(word)) return emoji;
                    }
                }
                return fallbackEmojis[Math.floor(Math.random() * fallbackEmojis.length)];
            }

            function generateSticker() {
                let topic = topicInput.value.trim();
                if (!topic) {
                    topic = 'شادی';
                    topicInput.value = topic;
                }

                const emoji = getEmojiForTopic(topic);
                emojiDisplay.textContent = emoji;
                textDisplay.textContent = topic;

                const sticker = document.getElementById('sticker');
                const colors = [
                    'linear-gradient(145deg, #ffd966, #ffb347)',
                    'linear-gradient(145deg, #fbc2eb, #a6c1ee)',
                    'linear-gradient(145deg, #fddb92, #d1fdff)',
                    'linear-gradient(145deg, #f6d365, #fda085)',
                    'linear-gradient(145deg, #f093fb, #f5576c)',
                    'linear-gradient(145deg, #4facfe, #00f2fe)',
                    'linear-gradient(145deg, #43e97b, #38f9d7)',
                    'linear-gradient(145deg, #fa709a, #fee140)',
                    'linear-gradient(145deg, #a18cd1, #fbc2eb)',
                    'linear-gradient(145deg, #fccb90, #d57eeb)'
                ];
                let hash = 0;
                for (let i = 0; i < topic.length; i++) {
                    hash = topic.charCodeAt(i) + ((hash << 5) - hash);
                }
                sticker.style.background = colors[Math.abs(hash) % colors.length];

                if (topic.length > 10) textDisplay.style.fontSize = '1.4rem';
                else textDisplay.style.fontSize = '1.9rem';
                if (topic.length > 15) textDisplay.style.fontSize = '1.1rem';

                statusMsg.textContent = '✅ استیکر ساخته شد!';
                statusMsg.style.color = '#aaffaa';
            }

            // ====== دانلود با روش مطمئن ======
            function downloadSticker() {
                const stickerElement = document.getElementById('stickerBox');
                statusMsg.textContent = '⏳ در حال ساخت تصویر...';
                statusMsg.style.color = '#ffd700';

                // غیرفعال کردن دکمه
                downloadBtn.disabled = true;
                downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> آماده‌سازی...';

                html2canvas(stickerElement, {
                    scale: 2.5,
                    backgroundColor: null,
                    allowTaint: false,
                    useCORS: true,
                    logging: false,
                    borderRadius: '50px',
                    width: stickerElement.scrollWidth,
                    height: stickerElement.scrollHeight,
                }).then((canvas) => {
                    // روش مطمئن دانلود
                    const link = document.createElement('a');
                    link.download = `sticker-${topicInput.value.trim() || 'golden'}.png`;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    statusMsg.textContent = '✅ دانلود با موفقیت انجام شد!';
                    statusMsg.style.color = '#aaffaa';
                    downloadBtn.disabled = false;
                    downloadBtn.innerHTML = '<i class="fas fa-download"></i> دانلود PNG';
                }).catch((error) => {
                    console.error('خطا:', error);
                    statusMsg.textContent = '❌ خطا در دانلود، دوباره تلاش کنید';
                    statusMsg.style.color = '#ff6b6b';
                    downloadBtn.disabled = false;
                    downloadBtn.innerHTML = '<i class="fas fa-download"></i> دانلود PNG';
                });
            }

            // ====== کپی استیکر به صورت متن ======
            function copySticker() {
                const topic = topicInput.value.trim() || 'شادی';
                const emoji = getEmojiForTopic(topic);
                const stickerText = `${emoji} ${topic} ${emoji}`;
                
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(stickerText).then(() => {
                        statusMsg.textContent = `✅ کپی شد: "${stickerText}"`;
                        statusMsg.style.color = '#6bcbff';
                    }).catch(() => {
                        fallbackCopy(stickerText);
                    });
                } else {
                    fallbackCopy(stickerText);
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    statusMsg.textContent = `✅ کپی شد: "${text}"`;
                    statusMsg.style.color = '#6bcbff';
                } catch (err) {
                    statusMsg.textContent = '❌ کپی نشد، متن را دستی کپی کنید: ' + text;
                    statusMsg.style.color = '#ff6b6b';
                }
                document.body.removeChild(textarea);
            }

            // رویدادها
            generateBtn.addEventListener('click', generateSticker);
            downloadBtn.addEventListener('click', downloadSticker);
            copyBtn.addEventListener('click', copySticker);

            topicInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') generateSticker();
            });

            window.addEventListener('load', generateSticker);
        })();
    </script>
</body>
</html>
